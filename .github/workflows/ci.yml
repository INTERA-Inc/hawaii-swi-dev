name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    # nightly, to pick up new modflow6-feat-swi-preview releases
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: pixi install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # get-mf6 runs explicitly below instead of from the activation hook
      MF6_SKIP_AUTOINSTALL: "1"
      # authenticates flopy's get-modflow GitHub API requests
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # linux-64, osx-arm64, and win-64
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi and install the locked environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true
          cache: true

      - name: Install MODFLOW 6 SWI preview
        run: pixi run get-mf6 --force

      - name: Install MODFLOW-2005
        run: pixi run get-exes --force

      - name: Check MODFLOW-2005
        run: pixi run python -c "import shutil, sys; exe = shutil.which('mf2005dbl'); print(exe); sys.exit(exe is None)"

      - name: Check MODFLOW 6
        run: pixi run check-mf6

      - name: Import the generated flopy SWI classes with the activation hook enabled
        env:
          MF6_SKIP_AUTOINSTALL: ""
        run: pixi run python -c "import flopy; print(flopy.mf6.ModflowGwfswi)"

      - name: Run SWI smoke test
        run: pixi run smoke-test

      - name: Run SWI notebooks
        run: pixi run run-verification-notebooks

      - name: Download the data release for one island
        run: pixi run get-data oahu

      - name: Check the data release
        shell: bash
        run: |
          test -f data/pp1876/model/input.oahu.0/Oahu_04_0.nam
          test -f data/pp1876/output/output.oahu.0/Oahu_04_0.hds
          test -f data/pp1876/output/output.oahu.0/Oahu_04_0.zta
          test ! -e data/pp1876/model/input.kauai.0
          # a second run finds everything up to date and downloads nothing
          pixi run get-data oahu | tee get-data.log
          if grep -q downloading get-data.log; then exit 1; fi

