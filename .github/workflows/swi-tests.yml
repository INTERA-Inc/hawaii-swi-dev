name: SWI tests

on:
  schedule:
    # nightly, to report new and changed SWI autotests on the feat-swi branch
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check the SWI autotests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'INTERA-Inc'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: SWI autotests changed on feat-swi
    steps:
      - uses: actions/checkout@v7

      - name: Report the new and changed tests
        run: python3 scripts/check_swi_tests.py > report.md

      - name: Open, update, or close the issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -s report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The verification notebooks are up to date."
          fi
