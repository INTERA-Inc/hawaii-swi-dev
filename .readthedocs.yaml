# Read the Docs configuration. The notebooks are executed by the docs workflow,
# which uploads them as an artifact and triggers this build; rtds_action
# downloads them (docs/source/conf.py). Set GITHUB_TOKEN in the Read the Docs
# project environment variables so the artifact can be downloaded.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
  jobs:
    pre_build:
      - python scripts/sphinx_prepare_notebooks.py --skip-if-exist

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
