# Read the Docs configuration. The pixi environment is installed so the SWI
# notebooks are executed with the SWI preview build of MODFLOW 6. Set a
# GITHUB_TOKEN environment variable in the project settings so get-mf6 is not
# subject to the unauthenticated GitHub API rate limit.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - $HOME/.pixi/bin/pixi install --locked
    - MF6_SKIP_AUTOINSTALL=1 $HOME/.pixi/bin/pixi run get-mf6
    - $HOME/.pixi/bin/pixi run sphinx-build -b html docs $READTHEDOCS_OUTPUT/html
